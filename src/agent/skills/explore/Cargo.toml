[package]
name = "explore-skill"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "스킬 explore(집 탐사): LLM(Qwen3.5-9B, 원형 도구 호출 루프) 또는 프런티어 기준선이 move_robot 하나로 집 지도를 채운다. 결정 기록·집계 포함"
publish = false

[lib]
name = "explore"
path = "src/lib.rs"

[[bin]]
name = "explore"
path = "src/bin/explore.rs"

[[bin]]
name = "decisions-agg"
path = "src/bin/decisions_agg.rs"

[dependencies]
serde_json = "1"
move_robot = { path = "../../tools/move_robot" }
bagent = { package = "behavior-agent", path = "../../../behavior-2026/src/agent/planner" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
